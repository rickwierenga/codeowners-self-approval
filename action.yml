name: Code ownership
description: Check CODEOWNERS against the PR author and owner reviews.
inputs:
  app-token:
    description: Installation token from the organization's ownership GitHub App.
    required: true
  app-id:
    description: ID of that GitHub App.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: refs/heads/main
        fetch-depth: 0
        persist-credentials: false
    - shell: bash
      working-directory: ${{ github.workspace }}
      run: python3 "$ACTION_PATH/owner_approval.py"
      env:
        ACTION_PATH: ${{ github.action_path }}
        APP_TOKEN: ${{ inputs.app-token }}
        APP_ID: ${{ inputs.app-id }}
